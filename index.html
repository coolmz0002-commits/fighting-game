<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>CRIMSON ARENA</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;600&display=swap" rel="stylesheet">

<style>

/* =========================================================
   ROOT
========================================================= */

:root {
    --bg: #0b0705;
    --blood: #c8102e;
    --blood-bright: #ff2438;
    --gold: #e8a33d;
    --gold-dim: #8a6423;
    --p1: #28d4ff;
    --p2: #ff7a29;
}


/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;

    overflow: hidden;

    background: var(--bg);

    color: #f2e9dd;

    font-family: 'Oswald', sans-serif;

    touch-action: none;

    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
}


/* =========================================================
   STAGE
========================================================= */

#stage {
    position: relative;

    width: 100vw;
    height: 100vh;

    overflow: hidden;
}


/* =========================================================
   CANVAS
========================================================= */

#three-canvas {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    display: block;
}


/* =========================================================
   VIGNETTE
========================================================= */

.vignette {
    position: absolute;

    inset: 0;

    pointer-events: none;

    z-index: 3;

    background:
        radial-gradient(
            ellipse at center,
            transparent 45%,
            rgba(0,0,0,.75) 100%
        );
}


/* =========================================================
   TITLE
========================================================= */

#title {
    position: absolute;

    top: 14px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 5;

    font-family: 'Bebas Neue', sans-serif;

    font-size: 34px;

    letter-spacing: 10px;

    color: var(--gold);

    text-shadow:
        0 0 18px rgba(232,163,61,.5),
        0 2px 0 #000;

    white-space: nowrap;

    pointer-events: none;
}


/* =========================================================
   HUD
========================================================= */

#hud {
    position: absolute;

    top: 56px;
    left: 0;
    right: 0;

    z-index: 5;

    display: flex;

    align-items: flex-start;
    justify-content: space-between;

    padding: 0 30px;

    pointer-events: none;
}

.panel {
    width: 38%;

    padding: 8px 12px;

    background:
        linear-gradient(
            180deg,
            rgba(21,12,9,.9),
            rgba(21,12,9,.55)
        );

    border: 1px solid var(--gold-dim);
}

.panel.right {
    text-align: right;
}

.fighterName {
    font-family: 'Bebas Neue', sans-serif;

    font-size: 20px;

    letter-spacing: 3px;
}

.fighterName.p1 {
    color: var(--p1);

    text-shadow:
        0 0 10px rgba(40,212,255,.6);
}

.fighterName.p2 {
    color: var(--p2);

    text-shadow:
        0 0 10px rgba(255,122,41,.6);
}


/* =========================================================
   HEALTH
========================================================= */

.healthOuter {
    width: 100%;
    height: 16px;

    margin-top: 6px;

    overflow: hidden;

    background: #1c0e0e;

    border: 1px solid #000;
}

.healthInner {
    width: 100%;
    height: 100%;

    background:
        linear-gradient(
            180deg,
            #ffe37a,
            var(--gold) 40%,
            #b5761a
        );

    transition: width .18s ease;
}

.healthInner.low {
    background:
        linear-gradient(
            180deg,
            #ff6a5e,
            var(--blood-bright) 40%,
            #7a0f1a
        );
}


/* =========================================================
   TIMER
========================================================= */

#timerWrap {
    padding-top: 4px;

    font-family: 'Bebas Neue', sans-serif;

    font-size: 44px;

    line-height: 1;

    color: var(--gold);

    text-shadow:
        0 0 14px rgba(232,163,61,.6),
        0 2px 0 #000;
}


/* =========================================================
   BANNER
========================================================= */

#banner {
    position: absolute;

    top: 42%;
    left: 50%;

    transform: translate(-50%, -50%);

    z-index: 20;

    display: none;

    font-family: 'Bebas Neue', sans-serif;

    font-size: 64px;

    letter-spacing: 6px;

    color: var(--blood-bright);

    text-shadow:
        0 0 30px rgba(200,16,46,.8),
        0 3px 0 #000;

    white-space: nowrap;

    pointer-events: none;
}


/* =========================================================
   REMATCH
========================================================= */

#restartBtn {
    position: absolute;

    top: 58%;
    left: 50%;

    transform: translateX(-50%);

    z-index: 30;

    display: none;

    min-width: 150px;
    min-height: 52px;

    padding: 14px 30px;

    border: 1px solid var(--gold-dim);

    background:
        linear-gradient(
            180deg,
            #3a1414,
            #1a0808
        );

    color: var(--gold);

    font-family: 'Bebas Neue', sans-serif;

    font-size: 20px;

    letter-spacing: 3px;

    cursor: pointer;

    touch-action: manipulation;

    -webkit-tap-highlight-color: transparent;
}

#restartBtn:active {
    transform:
        translateX(-50%)
        scale(.92);
}


/* =========================================================
   DESKTOP CONTROLS
========================================================= */

#controls {
    position: absolute;

    left: 50%;
    bottom: 10px;

    transform: translateX(-50%);

    z-index: 5;

    color: rgba(242,233,221,.55);

    font-size: 12px;

    letter-spacing: 1px;

    white-space: nowrap;

    pointer-events: none;

    text-align: center;
}

#controls b {
    color: var(--gold);
}


/* =========================================================
   MOBILE TOUCH SYSTEM
========================================================= */

#touchControls {
    position: absolute;

    inset: 0;

    z-index: 15;

    display: none;

    width: 100%;
    height: 100%;

    overflow: hidden;

    pointer-events: none;
}


/* =========================================================
   TOUCH PAD
========================================================= */

.touchPad {
    position: absolute;

    bottom:
        max(
            12px,
            env(safe-area-inset-bottom)
        );

    width: 145px;

    display: flex;

    flex-direction: column;

    gap: 6px;

    pointer-events: auto;

    user-select: none;
    -webkit-user-select: none;

    touch-action: none;
}


/* Player 1 */

#p1Touch {
    left:
        max(
            8px,
            env(safe-area-inset-left)
        );
}


/* Player 2 */

#p2Touch {
    right:
        max(
            8px,
            env(safe-area-inset-right)
        );
}


/* =========================================================
   TOUCH LABEL
========================================================= */

.touchLabel {
    width: 100%;

    text-align: center;

    font-family: 'Bebas Neue', sans-serif;

    font-size: 12px;

    letter-spacing: 2px;

    color: var(--gold);

    text-shadow:
        0 2px 5px #000;

    pointer-events: none;
}


/* =========================================================
   TOUCH ROW
========================================================= */

.touchRow {
    width: 100%;

    display: flex;

    align-items: center;
    justify-content: center;

    gap: 5px;
}


/* =========================================================
   NORMAL TOUCH BUTTON
========================================================= */

.touchBtn {
    flex: 0 0 44px;

    width: 44px;
    height: 44px;

    min-width: 44px;
    min-height: 44px;

    padding: 0;

    border: 1px solid rgba(232,163,61,.8);

    border-radius: 10px;

    outline: none;

    background:
        linear-gradient(
            180deg,
            rgba(55,22,18,.98),
            rgba(20,8,8,.98)
        );

    color: #f2e9dd;

    font-family: 'Bebas Neue', sans-serif;

    font-size: 13px;

    font-weight: bold;

    display: flex;

    align-items: center;
    justify-content: center;

    text-align: center;

    cursor: pointer;

    touch-action: none;

    -webkit-tap-highlight-color: transparent;

    box-shadow:
        0 4px 8px rgba(0,0,0,.5),
        inset 0 0 10px rgba(200,16,46,.15);

    transition:
        transform .08s ease,
        background .08s ease;
}


/* =========================================================
   LEFT / RIGHT
========================================================= */

.touchBtn[data-key="KeyA"],
.touchBtn[data-key="KeyD"],
.touchBtn[data-key="ArrowLeft"],
.touchBtn[data-key="ArrowRight"] {
    font-size: 18px;
}


/* =========================================================
   JUMP
========================================================= */

.touchBtn[data-key="KeyW"],
.touchBtn[data-key="ArrowUp"] {
    margin: 0 auto;

    font-size: 18px;
}


/* =========================================================
   BLOCK
========================================================= */

.touchBtn.block {
    flex: 0 0 58px;

    width: 58px;

    border-color:
        rgba(40,212,255,.8);

    color: #65ddff;

    font-size: 11px;
}


/* =========================================================
   ATTACK BUTTONS
========================================================= */

.touchBtn.attack {
    flex: 0 0 68px;

    width: 68px;

    height: 46px;

    min-width: 68px;
    min-height: 46px;

    border-color:
        rgba(255,36,56,.95);

    color: #ff7d86;

    font-size: 12px;
}


/* =========================================================
   BUTTON PRESS
========================================================= */

.touchBtn:active,
.touchBtn.pressed {
    transform: scale(.88);

    background:
        linear-gradient(
            180deg,
            #7d2028,
            #351015
        );

    box-shadow:
        0 2px 5px rgba(0,0,0,.6),
        inset 0 0 15px rgba(255,80,60,.3);
}

.touchBtn.attack:active,
.touchBtn.attack.pressed {
    transform: scale(.90);

    background:
        linear-gradient(
            180deg,
            #a32632,
            #430d14
        );
}


/* =========================================================
   TABLET
========================================================= */

@media (min-width: 600px) and (max-width: 1100px) {

    .touchPad {
        width: 175px;

        bottom:
            max(
                18px,
                env(safe-area-inset-bottom)
            );
    }

    .touchBtn {
        flex-basis: 52px;

        width: 52px;
        height: 52px;

        min-width: 52px;
        min-height: 52px;
    }

    .touchBtn.block {
        flex-basis: 68px;

        width: 68px;
    }

    .touchBtn.attack {
        flex-basis: 78px;

        width: 78px;

        height: 50px;

        min-width: 78px;
        min-height: 50px;
    }
}


/* =========================================================
   SMALL PHONE
========================================================= */

@media (max-width: 420px) {

    .touchPad {
        width: 130px;

        bottom:
            max(
                8px,
                env(safe-area-inset-bottom)
            );
    }

    .touchRow {
        gap: 3px;
    }

    .touchBtn {
        flex-basis: 39px;

        width: 39px;
        height: 39px;

        min-width: 39px;
        min-height: 39px;

        border-radius: 9px;

        font-size: 11px;
    }

    .touchBtn.block {
        flex-basis: 50px;

        width: 50px;

        font-size: 9px;
    }

    .touchBtn.attack {
        flex-basis: 61px;

        width: 61px;

        height: 40px;

        min-width: 61px;
        min-height: 40px;

        font-size: 10px;
    }

    #title {
        font-size: 25px;

        letter-spacing: 5px;
    }

    #hud {
        top: 45px;

        padding: 0 8px;
    }

    .fighterName {
        font-size: 14px;
    }

    .healthOuter {
        height: 11px;
    }

    #timerWrap {
        font-size: 32px;
    }

    #banner {
        font-size: 42px;
    }
}


/* =========================================================
   VERY SMALL PHONE
========================================================= */

@media (max-width: 350px) {

    .touchPad {
        width: 116px;
    }

    .touchBtn {
        flex-basis: 35px;

        width: 35px;
        height: 35px;

        min-width: 35px;
        min-height: 35px;

        font-size: 10px;
    }

    .touchBtn.block {
        flex-basis: 44px;

        width: 44px;

        font-size: 8px;
    }

    .touchBtn.attack {
        flex-basis: 54px;

        width: 54px;

        height: 36px;

        min-width: 54px;
        min-height: 36px;

        font-size: 9px;
    }

    .touchLabel {
        font-size: 9px;
    }
}


/* =========================================================
   LANDSCAPE PHONE
========================================================= */

@media (orientation: landscape)
       and (max-height: 550px) {

    .touchPad {
        bottom: 5px;

        width: 125px;

        gap: 3px;
    }

    .touchRow {
        gap: 3px;
    }

    .touchBtn {
        flex-basis: 36px;

        width: 36px;
        height: 36px;

        min-width: 36px;
        min-height: 36px;

        border-radius: 8px;

        font-size: 10px;
    }

    .touchBtn.block {
        flex-basis: 47px;

        width: 47px;

        font-size: 8px;
    }

    .touchBtn.attack {
        flex-basis: 57px;

        width: 57px;

        height: 34px;

        min-width: 57px;
        min-height: 34px;

        font-size: 9px;
    }

    .touchLabel {
        font-size: 9px;
    }
}


/* =========================================================
   TOUCH DEVICES
========================================================= */

@media (pointer: coarse) {

    #touchControls {
        display: block;
    }

    #controls {
        display: none;
    }
}

</style>
</head>


<body>

<div id="stage">

    <canvas id="three-canvas"></canvas>

    <div class="vignette"></div>


    <!-- =====================================================
         TITLE
    ====================================================== -->

    <div id="title">
        CRIMSON ARENA
    </div>


    <!-- =====================================================
         HUD
    ====================================================== -->

    <div id="hud">

        <div class="panel">

            <div class="fighterName p1">
                RONIN
            </div>

            <div class="healthOuter">

                <div
                    id="hp1"
                    class="healthInner">
                </div>

            </div>

        </div>


        <div id="timerWrap">
            <span id="timer">60</span>
        </div>


        <div class="panel right">

            <div class="fighterName p2">
                VOLKAN
            </div>

            <div class="healthOuter">

                <div
                    id="hp2"
                    class="healthInner">
                </div>

            </div>

        </div>

    </div>


    <!-- =====================================================
         BANNER
    ====================================================== -->

    <div id="banner"></div>


    <!-- =====================================================
         REMATCH
    ====================================================== -->

    <button id="restartBtn">
        REMATCH
    </button>


    <!-- =====================================================
         DESKTOP CONTROLS
    ====================================================== -->

    <div id="controls">

        <b>P1</b>
        — A/D move · W jump · S block · F punch · G kick

        &nbsp;&nbsp;|&nbsp;&nbsp;

        <b>P2</b>
        — ←/→ move · ↑ jump · ↓ block · K punch · L kick

    </div>


    <!-- =====================================================
         MOBILE CONTROLS
    ====================================================== -->

    <div id="touchControls">


        <!-- =================================================
             PLAYER 1
        ================================================== -->

        <div
            class="touchPad"
            id="p1Touch">

            <div class="touchLabel">
                PLAYER 1
            </div>


            <!-- JUMP -->

            <div class="touchRow">

                <button
                    class="touchBtn"
                    data-key="KeyW"
                    aria-label="Player 1 Jump">

                    ▲

                </button>

            </div>


            <!-- MOVEMENT -->

            <div class="touchRow">

                <button
                    class="touchBtn"
                    data-key="KeyA"
                    aria-label="Player 1 Move Left">

                    ◀

                </button>


                <button
                    class="touchBtn block"
                    data-key="KeyS"
                    aria-label="Player 1 Block">

                    BLOCK

                </button>


                <button
                    class="touchBtn"
                    data-key="KeyD"
                    aria-label="Player 1 Move Right">

                    ▶

                </button>

            </div>


            <!-- ATTACK -->

            <div class="touchRow">

                <button
                    class="touchBtn attack"
                    data-key="KeyF"
                    aria-label="Player 1 Punch">

                    PUNCH

                </button>


                <button
                    class="touchBtn attack"
                    data-key="KeyG"
                    aria-label="Player 1 Kick">

                    KICK

                </button>

            </div>

        </div>


        <!-- =================================================
             PLAYER 2
        ================================================== -->

        <div
            class="touchPad"
            id="p2Touch">

            <div class="touchLabel">
                PLAYER 2
            </div>


            <!-- JUMP -->

            <div class="touchRow">

                <button
                    class="touchBtn"
                    data-key="ArrowUp"
                    aria-label="Player 2 Jump">

                    ▲

                </button>

            </div>


            <!-- MOVEMENT -->

            <div class="touchRow">

                <button
                    class="touchBtn"
                    data-key="ArrowLeft"
                    aria-label="Player 2 Move Left">

                    ◀

                </button>


                <button
                    class="touchBtn block"
                    data-key="ArrowDown"
                    aria-label="Player 2 Block">

                    BLOCK

                </button>


                <button
                    class="touchBtn"
                    data-key="ArrowRight"
                    aria-label="Player 2 Move Right">

                    ▶

                </button>

            </div>


            <!-- ATTACK -->

            <div class="touchRow">

                <button
                    class="touchBtn attack"
                    data-key="KeyK"
                    aria-label="Player 2 Punch">

                    PUNCH

                </button>


                <button
                    class="touchBtn attack"
                    data-key="KeyL"
                    aria-label="Player 2 Kick">

                    KICK

                </button>

            </div>

        </div>

    </div>

</div>


<!-- =========================================================
     THREE.JS
========================================================= -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>


<script>

/* =========================================================
   THREE.JS SETUP
========================================================= */

const canvas =
    document.getElementById(
        "three-canvas"
    );


const renderer =
    new THREE.WebGLRenderer({

        canvas: canvas,

        antialias: true,

        alpha: false

    });


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


const scene =
    new THREE.Scene();


scene.background =
    new THREE.Color(
        0x0b0705
    );


scene.fog =
    new THREE.FogExp2(
        0x0b0705,
        0.0026
    );


const camera =
    new THREE.PerspectiveCamera(
        42,

        window.innerWidth /
        window.innerHeight,

        1,

        3000
    );


camera.position.set(
    0,
    130,
    430
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


/* =========================================================
   LIGHTS
========================================================= */

scene.add(
    new THREE.AmbientLight(
        0x30201a,
        1.1
    )
);


const mainLight =
    new THREE.SpotLight(
        0xffd9a0,
        1.6,
        1200,
        Math.PI / 4.2,
        .5,
        1.4
    );


mainLight.position.set(
    0,
    500,
    120
);


mainLight.target.position.set(
    0,
    0,
    0
);


scene.add(
    mainLight,
    mainLight.target
);


const p1Light =
    new THREE.PointLight(
        0x28d4ff,
        2.2,
        500
    );


p1Light.position.set(
    -220,
    90,
    140
);


scene.add(
    p1Light
);


const p2Light =
    new THREE.PointLight(
        0xff7a29,
        2.2,
        500
    );


p2Light.position.set(
    220,
    90,
    140
);


scene.add(
    p2Light
);


/* =========================================================
   TORCHES
========================================================= */

function makeTorch(x, z) {

    const pole =
        new THREE.Mesh(

            new THREE.CylinderGeometry(
                3,
                3,
                90,
                6
            ),

            new THREE.MeshStandardMaterial({
                color: 0x2a1c10
            })

        );


    pole.position.set(
        x,
        45,
        z
    );


    scene.add(pole);


    const light =
        new THREE.PointLight(
            0xff7a1a,
            1.6,
            260
        );


    light.position.set(
        x,
        100,
        z
    );


    scene.add(light);


    const flame =
        new THREE.Mesh(

            new THREE.ConeGeometry(
                6,
                18,
                8
            ),

            new THREE.MeshBasicMaterial({
                color: 0xffaa33
            })

        );


    flame.position.set(
        x,
        100,
        z
    );


    scene.add(flame);


    return {
        light,
        flame
    };

}


const torches = [

    makeTorch(-320, -40),
    makeTorch(320, -40),
    makeTorch(-320, 200),
    makeTorch(320, 200)

];


/* =========================================================
   FLOOR
========================================================= */

const floor =
    new THREE.Mesh(

        new THREE.PlaneGeometry(
            1400,
            900
        ),

        new THREE.MeshStandardMaterial({
            color: 0x241611,
            roughness: .95
        })

    );


floor.rotation.x =
    -Math.PI / 2;


scene.add(floor);


const grid =
    new THREE.GridHelper(
        1400,
        40,
        0x8a1a1a,
        0x2a1512
    );


grid.position.y = .5;


scene.add(grid);


/* =========================================================
   ARENA WALL
========================================================= */

const wall =
    new THREE.Mesh(

        new THREE.CylinderGeometry(
            700,
            700,
            260,
            24,
            1,
            true
        ),

        new THREE.MeshStandardMaterial({
            color: 0x140a08,
            side: THREE.BackSide,
            roughness: 1
        })

    );


wall.position.y = 120;


scene.add(wall);


/* =========================================================
   FIGHTER MODEL
========================================================= */

function buildFighter(color) {

    const group =
        new THREE.Group();


    const bodyMaterial =
        new THREE.MeshStandardMaterial({

            color: color,

            roughness: .55,

            metalness: .15,

            emissive: color,

            emissiveIntensity: .08

        });


    const darkMaterial =
        new THREE.MeshStandardMaterial({

            color: 0x1a1210,

            roughness: .8

        });


    const torso =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                30,
                46,
                20
            ),

            bodyMaterial

        );


    torso.position.y = 78;


    group.add(torso);


    const head =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                12,
                16,
                16
            ),

            new THREE.MeshStandardMaterial({

                color: 0xd8b48a,

                roughness: .7

            })

        );


    head.position.y = 112;


    group.add(head);


    const hips =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                26,
                16,
                18
            ),

            darkMaterial

        );


    hips.position.y = 50;


    group.add(hips);


    function limb(
        length,
        radius,
        material
    ) {

        const pivot =
            new THREE.Group();


        const mesh =
            new THREE.Mesh(

                new THREE.CylinderGeometry(
                    radius,
                    radius * .85,
                    length,
                    8
                ),

                material

            );


        mesh.position.y =
            -length / 2;


        pivot.add(mesh);


        return pivot;

    }


    const armR =
        limb(
            38,
            6,
            bodyMaterial
        );


    armR.position.set(
        16,
        96,
        4
    );


    group.add(armR);


    const armL =
        limb(
            38,
            6,
            bodyMaterial
        );


    armL.position.set(
        -16,
        96,
        -4
    );


    group.add(armL);


    const legR =
        limb(
            46,
            7.5,
            darkMaterial
        );


    legR.position.set(
        10,
        44,
        4
    );


    group.add(legR);


    const legL =
        limb(
            46,
            7.5,
            darkMaterial
        );


    legL.position.set(
        -10,
        44,
        -4
    );


    group.add(legL);


    return {

        group,

        torso,

        head,

        armR,

        armL,

        legR,

        legL

    };

}


/* =========================================================
   FIGHTER STATE
========================================================= */

function createFighter(
    x,
    facing,
    color,
    controls
) {

    const model =
        buildFighter(color);


    scene.add(
        model.group
    );


    return {

        x: x,

        y: 0,

        z: 0,

        vx: 0,

        vy: 0,

        facing: facing,

        hp: 100,

        onGround: true,

        blocking: false,

        attackType: null,

        attackTimer: 0,

        attackDuration: 0,

        attackCooldown: 0,

        hitThisSwing: false,

        hitStun: 0,

        controls: controls,

        model: model

    };

}


const p1 =
    createFighter(

        -140,

        1,

        {

            left: "KeyA",

const p2 =
    createFighter(

        {

/* =========================================================
   INPUT
========================================================= */

const keys = {};


/* Keyboard */

window.addEventListener(
    "keydown",
    event => {

        keys[event.code] = true;

    }
);


window.addEventListener(
    "keyup",
    event => {

        keys[event.code] = false;

    }
);


/* =========================================================
   TOUCH INPUT
========================================================= */

const touchButtons =
    document.querySelectorAll(
        ".touchBtn"
    );


touchButtons.forEach(
    button => {

        const key =
            button.dataset.key;


        button.addEventListener(
            "pointerdown",
            event => {

                event.preventDefault();

                keys[key] = true;

                button.classList.add(
                    "pressed"
                );


                try {

                    button.setPointerCapture(
                        event.pointerId
                    );

                }

                catch (error) {}

            }
        );


        button.addEventListener(
            "pointerup",
            event => {

                event.preventDefault();

                keys[key] = false;

                button.classList.remove(
                    "pressed"
                );

            }
        );


        button.addEventListener(
            "pointercancel",
            event => {

                event.preventDefault();

                keys[key] = false;

                button.classList.remove(
                    "pressed"
                );

            }
        );


        button.addEventListener(
            "lostpointercapture",
            () => {

                keys[key] = false;

                button.classList.remove(
                    "pressed"
                );

            }
        );

    }
);


/* Clear touch controls if window loses focus */

window.addEventListener(
    "blur",
    () => {

        Object.keys(keys).forEach(
            key => {

                keys[key] = false;

            }
        );


        touchButtons.forEach(
            button => {

                button.classList.remove(
                    "pressed"
                );

            }
        );

    }
);


/* Prevent long-press menu */

document
    .getElementById("touchControls")
    .addEventListener(
        "contextmenu",
        event => {

            event.preventDefault();

        }
    );


/* =========================================================
   GAME VARIABLES
========================================================= */

const ARENA_LIMIT = 280;

const SPEED = 4.4;

const JUMP_V = 11.5;

const GRAVITY = .55;

let timeLeft = 60;

let matchOver = false;

let introTimer = 3.5;

let inIntro = true;

let shakeTime = 0;


/* =========================================================
   INPUT HANDLER
========================================================= */

function handleInput(
    fighter,
    other
) {

    if (
        matchOver ||
        inIntro
    ) {

        return;

    }


    fighter.vx = 0;


    if (
        fighter.hitStun > 0
    ) {

        fighter.hitStun--;

        return;

    }


    fighter.blocking =
        keys[fighter.controls.down] &&
        fighter.onGround &&
        !fighter.attackType;


    if (
        !fighter.blocking
    ) {

        if (
            keys[fighter.controls.left]
        ) {

            fighter.vx =
                -SPEED;

        }


        if (
            keys[fighter.controls.right]
        ) {

            fighter.vx =
                SPEED;

        }

    }


    if (
        keys[fighter.controls.up] &&
        fighter.onGround
    ) {

        fighter.vy =
            JUMP_V;

        fighter.onGround =
            false;

    }


    fighter.facing =
        other.x > fighter.x
            ? 1
            : -1;


    if (
        fighter.attackCooldown > 0
    ) {

        fighter.attackCooldown--;

    }


    if (
        !fighter.attackType &&
        fighter.attackCooldown <= 0 &&
        !fighter.blocking
    ) {

        if (
            keys[fighter.controls.punch]
        ) {

            fighter.attackType =
                "punch";

            fighter.attackDuration =
                14;

            fighter.attackTimer =
                14;

            fighter.hitThisSwing =
                false;

        }

        else if (
            keys[fighter.controls.kick]
        ) {

            fighter.attackType =
                "kick";

            fighter.attackDuration =
                20;

            fighter.attackTimer =
                20;

            fighter.hitThisSwing =
                false;

        }

    }

}


/* =========================================================
   FIGHTER UPDATE
========================================================= */

function updateFighter(
    fighter
) {

    fighter.x +=
        fighter.vx;


    fighter.y +=
        fighter.vy;


    if (
        !fighter.onGround
    ) {

        fighter.vy -=
            GRAVITY;

    }


    if (
        fighter.y <= 0
    ) {

        fighter.y = 0;

        fighter.vy = 0;

        fighter.onGround = true;

    }


    fighter.x =
        Math.max(
            -ARENA_LIMIT,

            Math.min(
                ARENA_LIMIT,
                fighter.x
            )
        );


    if (
        fighter.attackType
    ) {

        fighter.attackTimer--;


        if (
            fighter.attackTimer <= 0
        ) {

            fighter.attackType =
                null;

            fighter.attackCooldown =
                10;

        }

    }

}


/* =========================================================
   HIT DETECTION
========================================================= */

function hitCheck(
    attacker,
    defender
) {

    if (
        !attacker.attackType ||
        attacker.hitThisSwing
    ) {

        return;

    }


    const activeStart =
        attacker.attackType === "punch"
            ? 5
            : 7;


    const activeEnd =
        attacker.attackType === "punch"
            ? 9
            : 14;


    const elapsed =
        attacker.attackDuration -
        attacker.attackTimer;


    if (
        elapsed < activeStart ||
        elapsed > activeEnd
    ) {

        return;

    }


    const reach =
        attacker.attackType === "punch"
            ? 44
            : 58;


    const distance =
        Math.abs(
            attacker.x -
            defender.x
        );


    if (
        distance <= reach
    ) {

        attacker.hitThisSwing =
            true;


        let damage =
            attacker.attackType === "punch"
                ? 6
                : 10;


        if (
            defender.blocking
        ) {

            damage *= .15;

            defender.vx +=
                attacker.facing * 2;

            shakeTime = 4;

        }

        else {

            defender.hitStun =
                10;

            defender.vx =
                attacker.facing * 5;

            shakeTime = 10;

        }


        defender.hp =
            Math.max(
                0,
                defender.hp - damage
            );

    }

}


/* =========================================================
   FIGHTER ANIMATION
========================================================= */

function animateFighter(
    fighter
) {

    const m =
        fighter.model;


    m.group.position.set(
        fighter.x,
        fighter.y,
        fighter.z
    );


    m.group.rotation.y =
        fighter.facing === 1
            ? 0
            : Math.PI;


    const t =
        performance.now() * .004;


    const bob =
        fighter.onGround &&
        fighter.vx === 0 &&
        !fighter.attackType

            ? Math.sin(t) * 1.5
            : 0;


    m.torso.position.y =
        78 + bob;


    m.head.position.y =
        112 + bob;


    let armR = .1;

    let armL = -.1;

    let legR = 0;

    let legL = 0;


    if (
        fighter.attackType === "punch"
    ) {

        const progress =
            1 -
            fighter.attackTimer /
            fighter.attackDuration;


        armR =
            -Math.sin(
                progress * Math.PI
            ) * 2;

    }


    else if (
        fighter.attackType === "kick"
    ) {

        const progress =
            1 -
            fighter.attackTimer /
            fighter.attackDuration;


        legR =
            -Math.sin(
                progress * Math.PI
            ) * 1.3;

    }


    else if (
        fighter.blocking
    ) {

        armR = -1.2;

        armL = 1.2;

    }


    else if (
        !fighter.onGround
    ) {

        legR = -.4;

        legL = .5;

        armR = -.3;

        armL = .3;

    }


    else if (
        Math.abs(
            fighter.vx
        ) > .1
    ) {

        legR =
            Math.sin(t * 3) * .6;

        legL =
            -Math.sin(t * 3) * .6;

        armR =
            -Math.sin(t * 3) * .4;

        armL =
            Math.sin(t * 3) * .4;

    }


    m.armR.rotation.x +=
        (
            armR -
            m.armR.rotation.x
        ) * .35;


    m.armL.rotation.x +=
        (
            armL -
            m.armL.rotation.x
        ) * .35;


    m.legR.rotation.x +=
        (
            legR -
            m.legR.rotation.x
        ) * .35;


    m.legL.rotation.x +=
        (
            legL -
            m.legL.rotation.x
        ) * .35;

}


/* =========================================================
   HUD
========================================================= */

function updateHUD() {

    const hp1 =
        document.getElementById(
            "hp1"
        );


    const hp2 =
        document.getElementById(
            "hp2"
        );


    hp1.style.width =
        p1.hp + "%";


    hp2.style.width =
        p2.hp + "%";


    hp1.classList.toggle(
        "low",
        p1.hp < 30
    );


    hp2.classList.toggle(
        "low",
        p2.hp < 30
    );


    document.getElementById(
        "timer"
    ).textContent =
        Math.max(
            0,
            Math.ceil(timeLeft)
        );

}


/* =========================================================
   BANNER
========================================================= */

function showBanner(
    text
) {

    const banner =
        document.getElementById(
            "banner"
        );


    banner.textContent =
        text;


    banner.style.display =
        "block";

}


function hideBanner() {

    document.getElementById(
        "banner"
    ).style.display =
        "none";

}


/* =========================================================
   END MATCH
========================================================= */

function endMatch(
    text
) {

    matchOver = true;

    showBanner(
        text
    );


    document.getElementById(
        "restartBtn"
    ).style.display =
        "block";

}


/* =========================================================
   REMATCH
========================================================= */

document
    .getElementById(
        "restartBtn"
    )
    .addEventListener(
        "click",
        () => {

            p1.x = -140;
            p1.y = 0;
            p1.vx = 0;
            p1.vy = 0;
            p1.hp = 100;
            p1.attackType = null;
            p1.attackTimer = 0;
            p1.attackCooldown = 0;
            p1.hitStun = 0;
            p1.blocking = false;


            p2.x = 140;
            p2.y = 0;
            p2.vx = 0;
            p2.vy = 0;
            p2.hp = 100;
            p2.attackType = null;
            p2.attackTimer = 0;
            p2.attackCooldown = 0;
            p2.hitStun = 0;
            p2.blocking = false;


            timeLeft = 60;

            matchOver = false;

            inIntro = true;

            introTimer = 3.5;


            document.getElementById(
                "restartBtn"
            ).style.display =
                "none";


            Object.keys(keys).forEach(
                key => {

                    keys[key] = false;

                }
            );


            touchButtons.forEach(
                button => {

                    button.classList.remove(
                        "pressed"
                    );

                }
            );

        }
    );


/* =========================================================
   GAME LOOP
========================================================= */

let lastTime =
    performance.now();


function gameLoop(
    now
) {

    const dt =
        Math.min(
            (now - lastTime) / 1000,
            .05
        );


    lastTime =
        now;


    /* Torch animation */

    torches.forEach(
        torch => {

            torch.light.intensity =
                1.4 +
                Math.random() * .5;


            torch.flame.scale.y =
                .85 +
                Math.random() * .3;

        }
    );


    /* Intro */

    if (
        inIntro
    ) {

        introTimer -= dt;


        if (
            introTimer <= 0
        ) {

            inIntro = false;

            hideBanner();

        }

        else if (
            introTimer > .7
        ) {

            showBanner(
                Math.ceil(
                    introTimer - .7
                )
            );

        }

        else {

            showBanner(
                "FIGHT!"
            );

        }

    }


    /* Match */

    else if (
        !matchOver
    ) {

        timeLeft -= dt;


        handleInput(
            p1,
            p2
        );


        handleInput(
            p2,
            p1
        );


        updateFighter(
            p1
        );


        updateFighter(
            p2
        );


        hitCheck(
            p1,
            p2
        );


        hitCheck(
            p2,
            p1
        );


        /* Winner */

        if (
            p1.hp <= 0 ||
            p2.hp <= 0
        ) {

            if (
                p1.hp <= 0 &&
                p2.hp <= 0
            ) {

                endMatch(
                    "DOUBLE K.O."
                );

            }

            else if (
                p1.hp <= 0
            ) {

                endMatch(
                    "VOLKAN WINS"
                );

            }

            else {

                endMatch(
                    "RONIN WINS"
                );

            }

        }


        else if (
            timeLeft <= 0
        ) {

            if (
                p1.hp > p2.hp
            ) {

                endMatch(
                    "RONIN WINS"
                );

            }

            else if (
                p2.hp > p1.hp
            ) {

                endMatch(
                    "VOLKAN WINS"
                );

            }

            else {

                endMatch(
                    "DRAW"
                );

            }

        }

    }


    /* Fighter animation */

    animateFighter(
        p1
    );


    animateFighter(
        p2
    );


    /* Camera */

    const middle =
        (
            p1.x +
            p2.x
        ) / 2;


    let cameraX =
        middle * .18;


    let cameraY =
        130;


    let cameraZ =
        430;


    if (
        shakeTime > 0
    ) {

        cameraX +=
            (
                Math.random() - .5
            ) * shakeTime;


        cameraY +=
            (
                Math.random() - .5
            ) * shakeTime;


        shakeTime--;

    }


    camera.position.set(
        cameraX,
        cameraY,
        cameraZ
    );


    camera.lookAt(
        middle * .3,
        70,
        0
    );


    /* HUD */

    updateHUD();


    /* Render */

    renderer.render(
        scene,
        camera
    );


    requestAnimationFrame(
        gameLoop
    );

}


requestAnimationFrame(
    gameLoop
);

</script>
