function makeTorch(x, z) {

  const pole =
    new THREE.Mesh(

      new THREE.CylinderGeometry(
        3,
        3,
        90,
        6
      ),

      new THREE.MeshStandardMaterial({
        color: 0x333333,
        roughness: 0.8
      })

  pole.position.set(
    x,
    45,
    z
  );

  scene.add(pole);


  const flameLight =
    new THREE.PointLight(
      0xff7a18,
      1.2,
      260
    );

  flameLight.position.set(
    x,
    100,
    z
  );

  scene.add(
    flameLight
  );


  const flameMesh =
    new THREE.Mesh(

      new THREE.ConeGeometry(
        6,
        18,
        8
      ),

      new THREE.MeshBasicMaterial({
        color: 0xffaa33
      })

    );

  flameMesh.position.set(
    x,
    100,
    z
  );

  scene.add(
    flameMesh
  );


  return {
    flameLight,
    flameMesh,
    baseIntensity: 1.2
  };
}

/* =========================================================
   FIGHTER MODEL
========================================================= */

function buildFighter(color) {

  const group =
    new THREE.Group();


  /*
    CHARACTER MATERIAL

    High emissive value makes the
    character visible against black.
  */

  const bodyMat =
    new THREE.MeshStandardMaterial({

      color: color,

      roughness: 0.38,

      metalness: 0.18,

      emissive: color,

      emissiveIntensity: 0.22

    });


  /* Dark pants */

  const pantsMat =
    new THREE.MeshStandardMaterial({

      color: 0x222222,

      roughness: 0.72,

      metalness: 0.1,

      emissive: 0x050505,

      emissiveIntensity: 0.1

    });


  /* Skin */

  const skinMat =
    new THREE.MeshStandardMaterial({

      color: 0xd8a57b,

      roughness: 0.68,

      metalness: 0.02,

      emissive: 0x24150d,

      emissiveIntensity: 0.08

    });


  /* =====================================================
     TORSO
  ===================================================== */

  const torso =
    new THREE.Mesh(

      new THREE.BoxGeometry(
        30,
        46,
        20
      ),

      bodyMat

    );

  torso.position.y =
    78;

  group.add(
    torso
  );


  /* =====================================================
     HEAD
  ===================================================== */

  const head =
    new THREE.Mesh(

      new THREE.SphereGeometry(
        12,
        20,
        20
      ),

      skinMat

    );

  head.position.y =
    112;

  group.add(
    head
  );


  /* =====================================================
     NECK
  ===================================================== */

  const neck =
    new THREE.Mesh(

      new THREE.CylinderGeometry(
        5,
        5,
        9,
        12
      ),

      skinMat

    );

  neck.position.y =
    99;

  group.add(
    neck
  );


  /* =====================================================
     WAIST / HIPS
  ===================================================== */

  const hips =
    new THREE.Mesh(

      new THREE.BoxGeometry(
        28,
        16,
        20
      ),

      pantsMat

    );

  hips.position.y =
    50;

  group.add(
    hips
  );


  /* =====================================================
     LIMB CREATOR
  ===================================================== */

  function makeLimb(
    len,
    radius,
    material
  ) {

    const pivot =
      new THREE.Group();


    const mesh =
      new THREE.Mesh(

        new THREE.CylinderGeometry(
          radius,
          radius * 0.88,
          len,
          12
        ),

        material

      );


    mesh.position.y =
      -len / 2;


    pivot.add(
      mesh
    );


    return pivot;
  }


  /* =====================================================
     RIGHT ARM
  ===================================================== */

  const armR =
    makeLimb(
      38,
      6,
      bodyMat
    );

  armR.position.set(
    17,
    96,
    4
  );

  group.add(
    armR
  );


  /* =====================================================
     LEFT ARM
  ===================================================== */

  const armL =
    makeLimb(
      38,
      6,
      bodyMat
    );

  armL.position.set(
    -17,
    96,
    -4
  );

  armL.rotation.x =
    0.15;

  group.add(
    armL
  );


  /* =====================================================
     RIGHT LEG
  ===================================================== */

  const legR =
    makeLimb(
      46,
      7.5,
      pantsMat
    );

  legR.position.set(
    10,
    44,
    4
  );

  group.add(
    legR
  );


  /* =====================================================
     LEFT LEG
  ===================================================== */

  const legL =
    makeLimb(
      46,
      7.5,
      pantsMat
    );

  legL.position.set(
    -10,
    44,
    -4
  );

  group.add(
    legL
  );


  /* =====================================================
     SHOULDER GLOW SPHERES
  ===================================================== */

  const shoulderR =
    new THREE.Mesh(

      new THREE.SphereGeometry(
        7,
        12,
        12
      ),

      bodyMat

    );

  shoulderR.position.set(
    17,
    95,
    4
  );

  group.add(
    shoulderR
  );


  const shoulderL =
    new THREE.Mesh(

      new THREE.SphereGeometry(
        7,
        12,
        12
      ),

      bodyMat

    );

  shoulderL.position.set(
    -17,
    95,
    -4
  );

  group.add(
    shoulderL
  );


  return {

    group,

    torso,

    head,

    armR,

    armL,

    legR,

    legL,

    shoulderR,

    shoulderL,

    baseColor: color

  };

}

function makeFighterState(

  facing,
  color,
  ctrl
) {

  const model =
    buildFighter(color);

  scene.add(
    model.group
  );


  return {

    x: xStart,

    y: 0,

    z: 0,

    vx: 0,

    vy: 0,

    facing,

    hp: 100,

    maxHp: 100,

    onGround: true,

    blocking: false,

    attackType: null,

    attackTimer: 0,

    attackDuration: 0,

    attackCooldown: 0,

    hitThisSwing: false,

    hitStun: 0,

    ctrl,

    model

  };

}

/* =========================================================
   BLOOD PARTICLES
========================================================= */

const bloodGeo =
  new THREE.IcosahedronGeometry(
    2.4,
    0
  );

let particles = [];

let decals = [];

const decalGeo =
  new THREE.CircleGeometry(
    1,
    10
  );


function spawnBlood(
  x,
  y,
  z,
  dirX
) {

  const n =
    16 +
    Math.floor(
      Math.random() * 10
    );


  for (
    let i = 0;
    i < n;
    i++
  ) {

    const mat =
      new THREE.MeshBasicMaterial({

        color: 0xb30d1f,

        transparent: true,

        opacity: 1

      });


    const mesh =
      new THREE.Mesh(
        bloodGeo,
        mat
      );


    mesh.position.set(

      x,

      y,

      z +
      (Math.random() - 0.5) * 10

    );


    mesh.scale.setScalar(

      0.6 +
      Math.random() * 0.8

    );


    scene.add(
      mesh
    );


    particles.push({

      mesh,

      vx:
        dirX *
        (2 +
          Math.random() * 5) +
        (Math.random() - 0.5) * 2,

      vy:
        Math.random() * 7 +
        3,

      vz:
        (Math.random() - 0.5) * 4,

      life:
        45 +
        Math.random() * 25

    });

  }

}


function addDecal(
  x,
  z
) {

  const mat =
    new THREE.MeshBasicMaterial({

      color: 0x5a0a12,

      transparent: true,

      opacity: 0.75,

      depthWrite: false

    });


  const mesh =
    new THREE.Mesh(
      decalGeo,
      mat
    );


  mesh.rotation.x =
    -Math.PI / 2;


  mesh.position.set(
    x,
    0.6,
    z
  );


  const scale =
    6 +
    Math.random() * 10;


  mesh.scale.set(
    scale,
    scale,
    scale
  );


  scene.add(
    mesh
  );


  decals.push(
    mesh
  );


  if (
    decals.length > 50
  ) {

    const old =
      decals.shift();

    scene.remove(
      old
    );

  }

}


function updateParticles() {

  for (
    let i = particles.length - 1;
    i >= 0;
    i--
  ) {

    const p =
      particles[i];


    p.vy -= 0.5;


    p.mesh.position.x +=
      p.vx;


    p.mesh.position.y +=
      p.vy * 0.5;


    p.mesh.position.z +=
      p.vz;


    p.life--;


    p.mesh.material.opacity =
      Math.max(
        0,
        p.life / 50
      );


    if (
      p.mesh.position.y <= 1 ||
      p.life <= 0
    ) {

      addDecal(
        p.mesh.position.x,
        p.mesh.position.z
      );


      scene.remove(
        p.mesh
      );


      particles.splice(
        i,
        1
      );

    }

  }

}


/* =========================================================
   GAME CONSTANTS
========================================================= */

const ARENA_LIMIT = 280;

const GROUND_Y = 0;

const SPEED = 4.4;

const JUMP_V = 11.5;

const GRAVITY = 0.55;


/* =========================================================
   COLLISION
========================================================= */

function rectsOverlapX(
  ax,
  ay,
  aw,
  ah,
  bx,
  by,
  bw,
  bh
) {

  return (

    ax < bx + bw &&
    ax + aw > bx &&
    ay < by + bh &&
    ay + ah > by

  );

}


/* =========================================================
   MATCH STATE
========================================================= */

let timeLeft = 60;

let matchOver = false;

let introTimer = 3.5;

let inIntro = true;

let shakeTime = 0;


/* =========================================================
   INPUT
========================================================= */

function handleInput(
  f,
  other
) {

  if (
    matchOver ||
    inIntro
  ) return;


  f.vx = 0;


  if (
    f.hitStun > 0
  ) {

    f.hitStun--;

    return;

  }


  f.blocking =
    keys[f.ctrl.down] &&
    f.onGround &&
    !f.attackType;


  if (!f.blocking) {

    if (
      keys[f.ctrl.left]
    ) {

      f.vx =
        -SPEED;

    }


    if (
      keys[f.ctrl.right]
    ) {

      f.vx =
        SPEED;

    }

  }


  if (
    keys[f.ctrl.up] &&
    f.onGround
  ) {

    f.vy =
      JUMP_V;

    f.onGround =
      false;

  }


  f.facing =
    other.x > f.x
      ? 1
      : -1;


  if (
    f.attackCooldown > 0
  ) {

    f.attackCooldown--;

  }


  if (
    !f.attackType &&
    f.attackCooldown <= 0 &&
    !f.blocking
  ) {

    if (
      keys[f.ctrl.punch]
    ) {

      f.attackType =
        'punch';

      f.attackDuration =
        14;

      f.attackTimer =
        14;

      f.hitThisSwing =
        false;

    }

    else if (
      keys[f.ctrl.kick]
    ) {

      f.attackType =
        'kick';

      f.attackDuration =
        20;

      f.attackTimer =
        20;

      f.hitThisSwing =
        false;

    }

  }

}


/* =========================================================
   UPDATE FIGHTER
========================================================= */

function updateFighter(f) {

  f.x +=
    f.vx;

  f.y +=
    f.vy;


  if (
    !f.onGround
  ) {

    f.vy -=
      GRAVITY;

  }


  if (
    f.y <= GROUND_Y
  ) {

    f.y = GROUND_Y;

    f.vy = 0;

    f.onGround =
      true;

  }


  f.x =
    Math.max(
      -ARENA_LIMIT,
      Math.min(
        ARENA_LIMIT,
        f.x
      )
    );


  if (
    f.attackType
  ) {

    f.attackTimer--;


    if (
      f.attackTimer <= 0
    ) {

      f.attackType =
        null;

      f.attackCooldown =
        10;

    }

  }

}


/* =========================================================
   HIT DETECTION
========================================================= */

function tryHit(
  attacker,
  defender
) {

  if (
    !attacker.attackType ||
    attacker.hitThisSwing
  ) return;


  const activeWindow =
    attacker.attackType === 'punch'
      ? [5, 9]
      : [7, 14];


  const elapsed =
    attacker.attackDuration -
    attacker.attackTimer;


  if (
    elapsed <
      activeWindow[0] ||
    elapsed >
      activeWindow[1]
  ) return;


  const reach =
    attacker.attackType === 'punch'
      ? 44
      : 58;


  const attackerW =
    30;


  const hitboxX =
    attacker.facing === 1

      ? attacker.x +
        attackerW / 2

      : attacker.x -
        attackerW / 2 -
        reach;


  const hitboxY =
    attacker.y +
    40;


  const defenderW =
    30;

  const defenderH =
    90;


  if (

    rectsOverlapX(

      hitboxX,
      hitboxY,
      reach,
      40,

      defender.x -
        defenderW / 2,

      defender.y,

      defenderW,
      defenderH

    )

  ) {

    attacker.hitThisSwing =
      true;


    const dmg =
      attacker.attackType === 'punch'
        ? 6
        : 10;


    if (
      defender.blocking
    ) {

      defender.hp -=
        dmg * 0.15;

      defender.vx +=
        attacker.facing * 2;

      shakeTime =
        4;

    }

    else {

      defender.hp -=
        dmg;

      defender.hitStun =
        10;

      defender.vx =
        attacker.facing * 5;


      spawnBlood(

        defender.x,

        defender.y + 75,

        defender.z,

        attacker.facing

      );


      shakeTime =
        10;

    }


    defender.hp =
      Math.max(
        0,
        defender.hp
      );

  }

}


/* =========================================================
   FIGHTER ANIMATION
========================================================= */

function animateFighter(f) {

  const m =
    f.model;


  m.group.position.set(
    f.x,
    f.y,
    f.z
  );


  m.group.rotation.y =
    f.facing === 1
      ? 0
      : Math.PI;


  const t =
    performance.now() *
    0.004;


  const bob =
    f.onGround &&
    f.vx === 0 &&
    !f.attackType

      ? Math.sin(
          t + f.x
        ) * 1.5

      : 0;


  m.torso.position.y =
    78 + bob;


  m.head.position.y =
    112 + bob;


  m.shoulderR.position.y =
    95 + bob;


  m.shoulderL.position.y =
    95 + bob;


  let armRRot =
    0.1;

  let armLRot =
    -0.1;

  let legRRot =
    0;

  let legLRot =
    0;


  if (
    f.attackType === 'punch'
  ) {

    const progress =
      1 -
      f.attackTimer /
      f.attackDuration;


    const swing =
      Math.sin(
        progress * Math.PI
      );


    armRRot =
      -swing * 2.0;

  }

  else if (
    f.attackType === 'kick'
  ) {

    const progress =
      1 -
      f.attackTimer /
      f.attackDuration;


    const swing =
      Math.sin(
        progress * Math.PI
      );


    legRRot =
      -swing * 1.3;

  }

  else if (
    f.blocking
  ) {

    armRRot =
      -1.2;

    armLRot =
      1.2;

  }

  else if (
    !f.onGround
  ) {

    legRRot =
      -0.4;

    legLRot =
      0.5;

    armRRot =
      -0.3;

    armLRot =
      0.3;

  }

  else if (
    Math.abs(f.vx) > 0.1
  ) {

    legRRot =
      Math.sin(
        t * 3
      ) * 0.6;

    legLRot =
      -Math.sin(
        t * 3
      ) * 0.6;

    armRRot =
      -Math.sin(
        t * 3
      ) * 0.4;

    armLRot =
      Math.sin(
        t * 3
      ) * 0.4;

  }


  m.armR.rotation.x +=
    (
      armRRot -
      m.armR.rotation.x
    ) * 0.35;


  m.armL.rotation.x +=
    (
      armLRot -
      m.armL.rotation.x
    ) * 0.35;


  m.legR.rotation.x +=
    (
      legRRot -
      m.legR.rotation.x
    ) * 0.35;


  m.legL.rotation.x +=
    (
      legLRot -
      m.legL.rotation.x
    ) * 0.35;


  /* Hit flash */

  const flash =
    f.hitStun > 0
      ? 0.65
      : 0.22;


  m.torso.material.emissiveIntensity +=

    (
      flash -
      m.torso.material.emissiveIntensity
    ) * 0.4;

}


/* =========================================================
   HUD
========================================================= */

function updateHUD() {

  const hp1El =
    document.getElementById(
      'hp1'
    );


  const hp2El =
    document.getElementById(
      'hp2'
    );


  hp1El.style.width =
    Math.max(
      0,
      p1.hp
    ) + '%';


  hp2El.style.width =
    Math.max(
      0,
      p2.hp
    ) + '%';


  hp1El.classList.toggle(
    'low',
    p1.hp < 30
  );


  hp2El.classList.toggle(
    'low',
    p2.hp < 30
  );


  document.getElementById(
    'timer'
  ).textContent =
    Math.max(
      0,
      Math.ceil(timeLeft)
    );

}


/* =========================================================
   BANNER
========================================================= */

function showBanner(text) {

  const b =
    document.getElementById(
      'banner'
    );

  b.textContent =
    text;

  b.style.display =
    'block';

}


function hideBanner() {

  document.getElementById(
    'banner'
  ).style.display =
    'none';

}


/* =========================================================
   END MATCH
========================================================= */

function endMatch(text) {

  matchOver =
    true;

  showBanner(
    text
  );

  document.getElementById(
    'restartBtn'
  ).style.display =
    'inline-block';

}


/* =========================================================
   RESTART
========================================================= */

document
  .getElementById(
    'restartBtn'
  )
  .addEventListener(
    'click',
    () => {

      p1.x = -140;
      p1.y = 0;
      p1.vx = 0;
      p1.vy = 0;
      p1.hp = 100;
      p1.attackType = null;
      p1.hitStun = 0;
      p1.blocking = false;


      p2.x = 140;
      p2.y = 0;
      p2.vx = 0;
      p2.vy = 0;
      p2.hp = 100;
      p2.attackType = null;
      p2.hitStun = 0;
      p2.blocking = false;


      particles.forEach(
        p =>
          scene.remove(
            p.mesh
          )
      );

      particles = [];


      decals.forEach(
        d =>
          scene.remove(d)
      );

      decals = [];


      timeLeft =
        60;

      matchOver =
        false;

      inIntro =
        true;

      introTimer =
        3.5;


      document.getElementById(
        'restartBtn'
      ).style.display =
        'none';

    }
  );


/* =========================================================
   MAIN LOOP
========================================================= */

let lastTick =
  performance.now();


function loop(now) {

  const dt =
    Math.min(
      (now - lastTick) /
        1000,
      0.05
    );


  lastTick =
    now;


  /* Torch flicker */

  torches.forEach(
    tr => {

      tr.flameLight.intensity =
        tr.baseIntensity +
        Math.random() * 0.5;


      tr.flameMesh.scale.y =
        0.85 +
        Math.random() * 0.3;

    }
  );


  /* =====================================================
     INTRO
  ===================================================== */

  if (
    inIntro
  ) {

    introTimer -=
      dt;


    if (
      introTimer <= 0
    ) {

      inIntro =
        false;

      hideBanner();

    }

    else if (
      introTimer > 0.7
    ) {

      showBanner(
        Math.ceil(
          introTimer - 0.7
        )
      );

    }

    else {

      showBanner(
        'FIGHT!'
      );

    }

  }


  /* =====================================================
     GAMEPLAY
  ===================================================== */

  else if (
    !matchOver
  ) {

    timeLeft -=
      dt;


    handleInput(
      p1,
      p2
    );


    handleInput(
      p2,
      p1
    );


    updateFighter(
      p1
    );


    updateFighter(
      p2
    );


    tryHit(
      p1,
      p2
    );


    tryHit(
      p2,
      p1
    );


    /* KO */

    if (
      p1.hp <= 0 ||
      p2.hp <= 0
    ) {

      if (
        p1.hp <= 0 &&
        p2.hp <= 0
      ) {

        endMatch(
          'DOUBLE K.O.'
        );

      }

      else if (
        p1.hp <= 0
      ) {

        endMatch(
          'VOLKAN WINS'
        );

      }

      else {

        endMatch(
          'RONIN WINS'
        );

      }

    }


    /* TIME UP */

    else if (
      timeLeft <= 0
    ) {

      if (
        p1.hp > p2.hp
      ) {

        endMatch(
          'RONIN WINS'
        );

      }

      else if (
        p2.hp > p1.hp
      ) {

        endMatch(
          'VOLKAN WINS'
        );

      }

      else {

        endMatch(
          'DRAW'
        );

      }

    }

  }


  /* =====================================================
     PARTICLES
  ===================================================== */

  updateParticles();


  /* =====================================================
     ANIMATE FIGHTERS
  ===================================================== */

  animateFighter(
    p1
  );

  animateFighter(
    p2
  );


  /* =====================================================
     CAMERA
  ===================================================== */

  const midX =
    (
      p1.x +
      p2.x
    ) / 2;


  const sway =
    Math.sin(
      now * 0.0004
    ) * 6;


  let camX =
    camBase.x +
    midX * 0.18 +
    sway;


  let camY =
    camBase.y;


  let camZ =
    camBase.z;


  if (
    shakeTime > 0
  ) {

    camX +=
      (
        Math.random() - 0.5
      ) * shakeTime;


    camY +=
      (
        Math.random() - 0.5
      ) * shakeTime;


    shakeTime -=
      1;

  }


  camera.position.set(
    camX,
    camY,
    camZ
  );


  camera.lookAt(
    midX * 0.3,
    70,
    0
  );


  /* =====================================================
     HUD + RENDER
  ===================================================== */

  updateHUD();


  renderer.render(
    scene,
    camera
  );


  requestAnimationFrame(
    loop
  );

}


requestAnimationFrame(
  loop
);

</script>
