<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<!-- Fixed viewport meta tag -->
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>CRIMSON ARENA</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link
  href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;600&display=swap"
  rel="stylesheet"
>

<style>

:root {
  --bg: #0b0705;
  --blood: #c8102e;
  --blood-bright: #ff2438;
  --gold: #e8a33d;
  --gold-dim: #8a6423;
  --p1: #28d4ff;
  --p2: #ff7a29;
  --panel: #150c09;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;

  background: var(--bg);

  overflow: hidden;

  font-family: 'Oswald', sans-serif;

  color: #f2e9dd;

  /*
   * Important for mobile gaming.
   */
  touch-action: none;

  -webkit-user-select: none;
  user-select: none;

  -webkit-touch-callout: none;
}

/* =========================================
   MAIN STAGE
========================================= */

#stage {
  position: relative;

  width: 100vw;
  height: 100vh;

  overflow: hidden;
}

canvas#three-canvas {
  position: absolute;

  inset: 0;

  display: block;

  width: 100%;
  height: 100%;
}

/* =========================================
   VIGNETTE
========================================= */

.vignette {
  position: absolute;

  inset: 0;

  pointer-events: none;

  background:
    radial-gradient(
      ellipse at center,
      transparent 45%,
      rgba(0, 0, 0, 0.75) 100%
    );

  z-index: 3;
}

/* =========================================
   TITLE
========================================= */

#title {
  position: absolute;

  top: 14px;
  left: 50%;

  transform: translateX(-50%);

  font-family: 'Bebas Neue', sans-serif;

  font-size: 34px;

  letter-spacing: 10px;

  color: var(--gold);

  text-shadow:
    0 0 18px rgba(232,163,61,0.5),
    0 2px 0 #000;

  z-index: 4;

  pointer-events: none;

  white-space: nowrap;
}

/* =========================================
   HUD
========================================= */

#hud {
  position: absolute;

  top: 56px;
  left: 0;
  right: 0;

  display: flex;

  justify-content: space-between;

  align-items: flex-start;

  padding: 0 30px;

  z-index: 4;

  pointer-events: none;
}

.panel {
  width: 38%;

  background:
    linear-gradient(
      180deg,
      rgba(21,12,9,0.85),
      rgba(21,12,9,0.55)
    );

  border: 1px solid var(--gold-dim);

  padding: 8px 12px;

  position: relative;
}

.panel.right {
  text-align: right;
}

.fighterName {
  font-family: 'Bebas Neue', sans-serif;

  font-size: 20px;

  letter-spacing: 3px;

  color: #f2e9dd;
}

.fighterName.p1 {
  color: var(--p1);

  text-shadow:
    0 0 10px rgba(40,212,255,0.6);
}

.fighterName.p2 {
  color: var(--p2);

  text-shadow:
    0 0 10px rgba(255,122,41,0.6);
}

.healthOuter {
  margin-top: 6px;

  width: 100%;
  height: 16px;

  background: #1c0e0e;

  border: 1px solid #000;

  box-shadow:
    inset 0 0 6px rgba(0,0,0,0.8);

  position: relative;

  overflow: hidden;
}

.healthInner {
  height: 100%;

  width: 100%;

  background:
    linear-gradient(
      180deg,
      #ffe37a,
      var(--gold) 40%,
      #b5761a
    );

  transition: width 0.18s ease;
}

.healthInner.low {
  background:
    linear-gradient(
      180deg,
      #ff6a5e,
      var(--blood-bright) 40%,
      #7a0f1a
    );
}

/* =========================================
   TIMER
========================================= */

#timerWrap {
  font-family: 'Bebas Neue', sans-serif;

  font-size: 44px;

  color: var(--gold);

  text-shadow:
    0 0 14px rgba(232,163,61,0.6),
    0 2px 0 #000;

  line-height: 1;

  padding-top: 4px;
}

/* =========================================
   BANNER
========================================= */

#banner {
  position: absolute;

  top: 42%;
  left: 50%;

  transform: translate(-50%, -50%);

  font-family: 'Bebas Neue', sans-serif;

  font-size: 64px;

  letter-spacing: 6px;

  color: var(--blood-bright);

  text-shadow:
    0 0 30px rgba(200,16,46,0.8),
    0 3px 0 #000;

  z-index: 20;

  display: none;

  text-align: center;

  pointer-events: none;

  white-space: nowrap;
}

/* =========================================
   REMATCH BUTTON
========================================= */

#restartBtn {
  position: absolute;

  top: 58%;
  left: 50%;

  transform: translateX(-50%);

  font-family: 'Bebas Neue', sans-serif;

  font-size: 20px;

  letter-spacing: 3px;

  background:
    linear-gradient(
      180deg,
      #3a1414,
      #1a0808
    );

  color: var(--gold);

  border: 1px solid var(--gold-dim);

  padding: 14px 30px;

  min-width: 150px;
  min-height: 52px;

  cursor: pointer;

  display: none;

  z-index: 30;

  touch-action: manipulation;

  -webkit-tap-highlight-color: transparent;

  transition:
    transform 0.12s ease,
    background 0.12s ease;
}

#restartBtn:hover {
  background: #4a1a1a;
}

#restartBtn:active {
  transform:
    translateX(-50%)
    scale(0.92);
}

/* =========================================
   DESKTOP CONTROLS
========================================= */

#controls {
  position: absolute;

  bottom: 10px;
  left: 50%;

  transform: translateX(-50%);

  font-size: 12px;

  letter-spacing: 1px;

  color: rgba(242,233,221,0.55);

  z-index: 4;

  text-align: center;

  pointer-events: none;

  white-space: nowrap;
}

#controls b {
  color: var(--gold);
}

/* =========================================
   TOUCH CONTROLS
========================================= */

#touchControls {
  position: absolute;

  inset: 0;

  z-index: 15;

  pointer-events: none;

  display: none;
}

/* =========================================
   PLAYER TOUCH PAD
========================================= */

.touchPad {
  position: absolute;

  bottom: 18px;

  display: grid;

  gap: 7px;

  pointer-events: auto;

  user-select: none;

  -webkit-user-select: none;

  touch-action: none;
}

#p1Touch {
  left: 15px;
}

#p2Touch {
  right: 15px;
}

/* =========================================
   PLAYER LABEL
========================================= */

.touchLabel {
  text-align: center;

  font-family: 'Bebas Neue', sans-serif;

  font-size: 13px;

  letter-spacing: 2px;

  color: var(--gold);

  margin-bottom: 2px;

  text-shadow:
    0 2px 4px #000;
}

/* =========================================
   TOUCH ROW
========================================= */

.touchRow {
  display: flex;

  gap: 7px;

  justify-content: center;
}

/* =========================================
   TOUCH BUTTON
========================================= */

.touchBtn {
  width: 58px;
  height: 58px;

  min-width: 58px;
  min-height: 58px;

  border: 1px solid rgba(232,163,61,0.7);

  border-radius: 14px;

  background:
    linear-gradient(
      180deg,
      rgba(55,22,18,0.96),
      rgba(20,8,8,0.96)
    );

  color: #f2e9dd;

  font-family: 'Bebas Neue', sans-serif;

  font-size: 17px;

  font-weight: bold;

  box-shadow:
    0 5px 15px rgba(0,0,0,0.45),
    inset 0 0 12px rgba(200,16,46,0.12);

  cursor: pointer;

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 0;

  outline: none;

  -webkit-tap-highlight-color: transparent;

  touch-action: none;

  transition:
    transform 0.08s ease,
    background 0.08s ease,
    box-shadow 0.08s ease;
}

.touchBtn:hover {
  background:
    linear-gradient(
      180deg,
      rgba(75,28,22,0.98),
      rgba(30,10,10,0.98)
    );
}

.touchBtn:active,
.touchBtn.pressed {
  transform: scale(0.88);

  background:
    linear-gradient(
      180deg,
      #7d2028,
      #351015
    );

  box-shadow:
    0 2px 5px rgba(0,0,0,0.5),
    inset 0 0 18px rgba(255,80,60,0.3);
}

/* =========================================
   ATTACK BUTTONS
========================================= */

.touchBtn.attack {
  border-color: rgba(255,36,56,0.9);

  color: #ff7d86;

  box-shadow:
    0 5px 15px rgba(0,0,0,0.45),
    inset 0 0 15px rgba(255,36,56,0.12);
}

/* =========================================
   BLOCK BUTTON
========================================= */

.touchBtn.block {
  border-color: rgba(40,212,255,0.8);

  color: #65ddff;
}

/* =========================================
   TOUCH RIPPLE
========================================= */

.touchBtn::after {
  content: "";

  position: absolute;

  width: 0;
  height: 0;

  border-radius: 50%;

  background: rgba(255,255,255,0.25);

  transform: translate(-50%, -50%);

  pointer-events: none;
}

/* =========================================
   MOBILE DISPLAY
========================================= */

@media (pointer: coarse) {

  #touchControls {
    display: block;
  }

  #controls {
    display: none;
  }

}

/* =========================================
   MOBILE SCREEN
========================================= */

@media (max-width: 700px) {

  #title {
    top: 10px;

    font-size: 26px;

    letter-spacing: 6px;
  }

  #hud {
    top: 45px;

    padding: 0 10px;
  }

  .panel {
    width: 36%;

    padding: 6px 7px;
  }

  .fighterName {
    font-size: 15px;

    letter-spacing: 2px;
  }

  .healthOuter {
    height: 12px;
  }

  #timerWrap {
    font-size: 34px;
  }

  #banner {
    font-size: 48px;

    letter-spacing: 4px;
  }

  .touchPad {
    bottom: 10px;
  }

  #p1Touch {
    left: 7px;
  }

  #p2Touch {
    right: 7px;
  }

  .touchBtn {
    width: 50px;
    height: 50px;

    min-width: 50px;
    min-height: 50px;

    border-radius: 12px;

    font-size: 14px;
  }

  .touchRow {
    gap: 5px;
  }

  .touchPad {
    gap: 5px;
  }

}

/* =========================================
   VERY SMALL PHONES
========================================= */

@media (max-width: 400px) {

  .touchBtn {
    width: 43px;
    height: 43px;

    min-width: 43px;
    min-height: 43px;

    border-radius: 10px;

    font-size: 12px;
  }

  .touchRow {
    gap: 4px;
  }

  .touchPad {
    gap: 4px;
  }

  .touchLabel {
    font-size: 11px;
  }

}

/* =========================================
   LANDSCAPE MOBILE
========================================= */

@media (max-height: 500px) {

  .touchPad {
    bottom: 6px;
  }

  .touchBtn {
    width: 42px;
    height: 42px;

    min-width: 42px;
    min-height: 42px;

    font-size: 11px;
  }

  .touchRow {
    gap: 4px;
  }

  .touchPad {
    gap: 4px;
  }

  #title {
    font-size: 22px;
  }

  #hud {
    top: 38px;
  }

  #timerWrap {
    font-size: 30px;
  }

}

</style>
</head>


<body>

<div id="stage">

  <canvas id="three-canvas"></canvas>

  <div class="vignette"></div>

  <div id="title">
    CRIMSON ARENA
  </div>


  <!-- =====================================
       HUD
  ====================================== -->

  <div id="hud">

    <div class="panel">

      <div class="fighterName p1">
        RONIN
      </div>

      <div class="healthOuter">

        <div
          id="hp1"
          class="healthInner"
        ></div>

      </div>

    </div>


    <div id="timerWrap">

      <span id="timer">
        60
      </span>

    </div>


    <div class="panel right">

      <div class="fighterName p2">
        VOLKAN
      </div>

      <div class="healthOuter">

        <div
          id="hp2"
          class="healthInner"
        ></div>

      </div>

    </div>

  </div>


  <!-- =====================================
       GAME BANNER
  ====================================== -->

  <div id="banner"></div>


  <!-- =====================================
       REMATCH
  ====================================== -->

  <button id="restartBtn">
    REMATCH
  </button>


  <!-- =====================================
       DESKTOP CONTROLS
  ====================================== -->

  <div id="controls">

    <b>P1</b>
    — A/D move · W jump · S block · F punch · G kick

    &nbsp;&nbsp;|&nbsp;&nbsp;

    <b>P2</b>
    — ←/→ move · ↑ jump · ↓ block · K punch · L kick

  </div>


  <!-- =====================================
       MOBILE TOUCH CONTROLS
  ====================================== -->

  <div id="touchControls">


    <!-- ===================================
         PLAYER 1
    ==================================== -->

    <div
      class="touchPad"
      id="p1Touch"
    >

      <div class="touchLabel">
        PLAYER 1
      </div>


      <!-- JUMP -->

      <div class="touchRow">

        <button
          class="touchBtn"
          data-key="KeyW"
          aria-label="Player 1 Jump"
        >
          ▲
        </button>

      </div>


      <!-- MOVEMENT + BLOCK -->

      <div class="touchRow">

        <button
          class="touchBtn"
          data-key="KeyA"
          aria-label="Player 1 Move Left"
        >
          ◀
        </button>


        <button
          class="touchBtn block"
          data-key="KeyS"
          aria-label="Player 1 Block"
        >
          BLOCK
        </button>


        <button
          class="touchBtn"
          data-key="KeyD"
          aria-label="Player 1 Move Right"
        >
          ▶
        </button>

      </div>


      <!-- ATTACK -->

      <div class="touchRow">

        <button
          class="touchBtn attack"
          data-key="KeyF"
          aria-label="Player 1 Punch"
        >
          PUNCH
        </button>


        <button
          class="touchBtn attack"
          data-key="KeyG"
          aria-label="Player 1 Kick"
        >
          KICK
        </button>

      </div>

    </div>


    <!-- ===================================
         PLAYER 2
    ==================================== -->

    <div
      class="touchPad"
      id="p2Touch"
    >

      <div class="touchLabel">
        PLAYER 2
      </div>


      <!-- JUMP -->

      <div class="touchRow">

        <button
          class="touchBtn"
          data-key="ArrowUp"
          aria-label="Player 2 Jump"
        >
          ▲
        </button>

      </div>


      <!-- MOVEMENT + BLOCK -->

      <div class="touchRow">

        <button
          class="touchBtn"
          data-key="ArrowLeft"
          aria-label="Player 2 Move Left"
        >
          ◀
        </button>


        <button
          class="touchBtn block"
          data-key="ArrowDown"
          aria-label="Player 2 Block"
        >
          BLOCK
        </button>


        <button
          class="touchBtn"
          data-key="ArrowRight"
          aria-label="Player 2 Move Right"
        >
          ▶
        </button>

      </div>


      <!-- ATTACK -->

      <div class="touchRow">

        <button
          class="touchBtn attack"
          data-key="KeyK"
          aria-label="Player 2 Punch"
        >
          PUNCH
        </button>


        <button
          class="touchBtn attack"
          data-key="KeyL"
          aria-label="Player 2 Kick"
        >
          KICK
        </button>

      </div>

    </div>

  </div>

</div>


<!-- =========================================
     THREE.JS
========================================= -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>


<script>

/* =========================================
   BASIC SETUP
========================================= */

const canvas =
  document.getElementById('three-canvas');


const renderer =
  new THREE.WebGLRenderer({
    canvas,
    antialias: true,
    alpha: false
  });


renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 2)
);


renderer.setSize(
  window.innerWidth,
  window.innerHeight
);


const scene =
  new THREE.Scene();


scene.fog =
  new THREE.FogExp2(
    0x0b0705,
    0.0026
  );


scene.background =
  new THREE.Color(0x0b0705);


const camera =
  new THREE.PerspectiveCamera(
    42,
    window.innerWidth /
      window.innerHeight,
    1,
    3000
  );


const camBase =
  new THREE.Vector3(
    0,
    130,
    430
  );


camera.position.copy(
  camBase
);


camera.lookAt(
  0,
  70,
  0
);


/* =========================================
   RESIZE
========================================= */

window.addEventListener(
  'resize',
  () => {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);


/* =========================================
   LIGHTING
========================================= */

scene.add(
  new THREE.AmbientLight(
    0x30201a,
    1.1
  )
);


const spot =
  new THREE.SpotLight(
    0xffd9a0,
    1.6,
    1200,
    Math.PI / 4.2,
    0.5,
    1.4
  );


spot.position.set(
  0,
  500,
  120
);


spot.target.position.set(
  0,
  0,
  0
);


scene.add(
  spot,
  spot.target
);


const rimP1 =
  new THREE.PointLight(
    0x28d4ff,
    2.2,
    500
  );


rimP1.position.set(
  -220,
  90,
  140
);


scene.add(rimP1);


const rimP2 =
  new THREE.PointLight(
    0xff7a29,
    2.2,
    500
  );


rimP2.position.set(
  220,
  90,
  140
);


scene.add(rimP2);


/* =========================================
   TORCHES
========================================= */

function makeTorch(x, z) {

  const pole =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        3,
        3,
        90,
        6
      ),

      new THREE.MeshStandardMaterial({
        color: 0x2a1c10
      })
    );


  pole.position.set(
    x,
    45,
    z
  );


  scene.add(pole);


  const flameLight =
    new THREE.PointLight(
      0xff7a1a,
      1.6,
      260
    );


  flameLight.position.set(
    x,
    100,
    z
  );


  scene.add(flameLight);


  const flameMesh =
    new THREE.Mesh(
      new THREE.ConeGeometry(
        6,
        18,
        8
      ),

      new THREE.MeshBasicMaterial({
        color: 0xffaa33
      })
    );


  flameMesh.position.set(
    x,
    100,
    z
  );


  scene.add(flameMesh);


  return {
    flameLight,
    flameMesh,
    baseIntensity: 1.6
  };

}


const torches = [

  makeTorch(-320, -40),
  makeTorch(320, -40),
  makeTorch(-320, 200),
  makeTorch(320, 200)

];


/* =========================================
   FLOOR
========================================= */

const floorGeo =
  new THREE.PlaneGeometry(
    1400,
    900,
    1,
    1
  );


const floorMat =
  new THREE.MeshStandardMaterial({
    color: 0x241611,
    roughness: 0.95
  });


const floor =
  new THREE.Mesh(
    floorGeo,
    floorMat
  );


floor.rotation.x =
  -Math.PI / 2;


floor.position.y = 0;


scene.add(floor);


const grid =
  new THREE.GridHelper(
    1400,
    40,
    0x8a1a1a,
    0x2a1512
  );


grid.position.y = 0.5;


scene.add(grid);


/* =========================================
   ARENA WALL
========================================= */

const wallGeo =
  new THREE.CylinderGeometry(
    700,
    700,
    260,
    24,
    1,
    true
  );


const wallMat =
  new THREE.MeshStandardMaterial({
    color: 0x140a08,
    side: THREE.BackSide,
    roughness: 1
  });


const wall =
  new THREE.Mesh(
    wallGeo,
    wallMat
  );


wall.position.y = 120;


scene.add(wall);


/* =========================================
   FIGHTER MODEL
========================================= */

function buildFighter(color) {

  const group =
    new THREE.Group();


  const mat =
    new THREE.MeshStandardMaterial({
      color,
      roughness: 0.55,
      metalness: 0.15,
      emissive: color,
      emissiveIntensity: 0.08
    });


  const darkMat =
    new THREE.MeshStandardMaterial({
      color: 0x1a1210,
      roughness: 0.8
    });


  const torso =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        30,
        46,
        20
      ),
      mat
    );


  torso.position.y = 78;


  group.add(torso);


  const head =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        12,
        16,
        16
      ),

      new THREE.MeshStandardMaterial({
        color: 0xd8b48a,
        roughness: 0.7
      })
    );


  head.position.y = 112;


  group.add(head);


  const hips =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        26,
        16,
        18
      ),
      darkMat
    );


  hips.position.y = 50;


  group.add(hips);


  function makeLimb(
    len,
    radius,
    matUsed
  ) {

    const pivot =
      new THREE.Group();


    const mesh =
      new THREE.Mesh(
        new THREE.CylinderGeometry(
          radius,
          radius * 0.85,
          len,
          8
        ),
        matUsed
      );


    mesh.position.y =
      -len / 2;


    pivot.add(mesh);


    return pivot;

  }


  const armR =
    makeLimb(
      38,
      6,
      mat
    );


  armR.position.set(
    16,
    96,
    4
  );


  group.add(armR);


  const armL =
    makeLimb(
      38,
      6,
      mat
    );


  armL.position.set(
    -16,
    96,
    -4
  );


  armL.rotation.x =
    0.15;


  group.add(armL);


  const legR =
    makeLimb(
      46,
      7.5,
      darkMat
    );


  legR.position.set(
    10,
    44,
    4
  );


  group.add(legR);


  const legL =
    makeLimb(
      46,
      7.5,
      darkMat
    );


  legL.position.set(
    -10,
    44,
    -4
  );


  group.add(legL);


  return {
    group,
    torso,
    head,
    armR,
    armL,
    legR,
    legL,
    baseColor: color
  };

}


/* =========================================
   FIGHTER STATE
========================================= */

function makeFighterState(
  xStart,
  facing,
  color,
  ctrl
) {

  const model =
    buildFighter(color);


  scene.add(
    model.group
  );


  return {

    x: xStart,

    y: 0,

    z: 0,

    vx: 0,

    vy: 0,

    facing,

    hp: 100,

    maxHp: 100,

    onGround: true,

    blocking: false,

    attackType: null,

    attackTimer: 0,

    attackDuration: 0,

    attackCooldown: 0,

    hitThisSwing: false,

    hitStun: 0,

    ctrl,

    model

  };

}


const p1 =
  makeFighterState(
    -140,
    1,
    0x28d4ff,
    {
      left: 'KeyA',
      right: 'KeyD',
      up: 'KeyW',
      down: 'KeyS',
      punch: 'KeyF',
      kick: 'KeyG'
    }
  );


const p2 =
  makeFighterState(
    140,
    -1,
    0xff7a29,
    {
      left: 'ArrowLeft',
      right: 'ArrowRight',
      up: 'ArrowUp',
      down: 'ArrowDown',
      punch: 'KeyK',
      kick: 'KeyL'
    }
  );


/* =========================================
   INPUT SYSTEM
========================================= */

const keys = {};


/* Keyboard */

window.addEventListener(
  'keydown',
  (e) => {

    keys[e.code] = true;

  }
);


window.addEventListener(
  'keyup',
  (e) => {

    keys[e.code] = false;

  }
);


/* =========================================
   MOBILE TOUCH INPUT
========================================= */

const touchButtons =
  document.querySelectorAll(
    '.touchBtn'
  );


touchButtons.forEach(
  (button) => {

    const key =
      button.dataset.key;


    /* Pointer down */

    button.addEventListener(
      'pointerdown',
      (event) => {

        event.preventDefault();

        keys[key] = true;

        button.classList.add(
          'pressed'
        );

        try {

          button.setPointerCapture(
            event.pointerId
          );

        } catch (error) {}

      }
    );


    /* Pointer up */

    button.addEventListener(
      'pointerup',
      (event) => {

        event.preventDefault();

        keys[key] = false;

        button.classList.remove(
          'pressed'
        );

      }
    );


    /* Pointer cancel */

    button.addEventListener(
      'pointercancel',
      (event) => {

        event.preventDefault();

        keys[key] = false;

        button.classList.remove(
          'pressed'
        );

      }
    );


    /* Pointer leaves button */

    button.addEventListener(
      'pointerleave',
      (event) => {

        if (event.buttons === 0) {

          keys[key] = false;

          button.classList.remove(
            'pressed'
          );

        }

      }
    );

  }
);


/* Release all touch keys */

window.addEventListener(
  'blur',
  () => {

    Object.keys(keys)
      .forEach(
        key => {
          keys[key] = false;
        }
      );

    touchButtons.forEach(
      button => {
        button.classList.remove(
          'pressed'
        );
      }
    );

  }
);


/* Prevent context menu */

document
  .getElementById('touchControls')
  .addEventListener(
    'contextmenu',
    event => {
      event.preventDefault();
    }
  );


/* =========================================
   BLOOD PARTICLES
========================================= */

const bloodGeo =
  new THREE.IcosahedronGeometry(
    2.4,
    0
  );


let particles = [];

let decals = [];


const decalGeo =
  new THREE.CircleGeometry(
    1,
    10
  );


function spawnBlood(
  x,
  y,
  z,
  dirX
) {

  const n =
    16 +
    Math.floor(
      Math.random() * 10
    );


  for (
    let i = 0;
    i < n;
    i++
  ) {

    const mat =
      new THREE.MeshBasicMaterial({
        color: 0xb30d1f,
        transparent: true,
        opacity: 1
      });


    const mesh =
      new THREE.Mesh(
        bloodGeo,
        mat
      );


    mesh.position.set(
      x,
      y,
      z +
      (Math.random() - 0.5) * 10
    );


    mesh.scale.setScalar(
      0.6 +
      Math.random() * 0.8
    );


    scene.add(mesh);


    particles.push({

      mesh,

      vx:
        dirX *
        (2 + Math.random() * 5) +
        (Math.random() - 0.5) * 2,

      vy:
        Math.random() * 7 + 3,

      vz:
        (Math.random() - 0.5) * 4,

      life:
        45 +
        Math.random() * 25

    });

  }

}


function addDecal(
  x,
  z
) {

  const mat =
    new THREE.MeshBasicMaterial({
      color: 0x5a0a12,
      transparent: true,
      opacity: 0.75,
      depthWrite: false
    });


  const mesh =
    new THREE.Mesh(
      decalGeo,
      mat
    );


  mesh.rotation.x =
    -Math.PI / 2;


  mesh.position.set(
    x,
    0.6,
    z
  );


  const scale =
    6 +
    Math.random() * 10;


  mesh.scale.set(
    scale,
    scale,
    scale
  );


  scene.add(mesh);


  decals.push(mesh);


  if (
    decals.length > 50
  ) {

    const old =
      decals.shift();

    scene.remove(old);

  }

}


function updateParticles() {

  for (
    let i = particles.length - 1;
    i >= 0;
    i--
  ) {

    const p =
      particles[i];


    p.vy -= 0.5;


    p.mesh.position.x +=
      p.vx;


    p.mesh.position.y +=
      p.vy * 0.5;


    p.mesh.position.z +=
      p.vz;


    p.life--;


    p.mesh.material.opacity =
      Math.max(
        0,
        p.life / 50
      );


    if (
      p.mesh.position.y <= 1 ||
      p.life <= 0
    ) {

      addDecal(
        p.mesh.position.x,
        p.mesh.position.z
      );


      scene.remove(
        p.mesh
      );


      particles.splice(
        i,
        1
      );

    }

  }

}


/* =========================================
   GAME CONSTANTS
========================================= */

const ARENA_LIMIT = 280;

const GROUND_Y = 0;

const SPEED = 4.4;

const JUMP_V = 11.5;

const GRAVITY = 0.55;


function rectsOverlapX(
  ax,
  ay,
  aw,
  ah,
  bx,
  by,
  bw,
  bh
) {

  return (
    ax < bx + bw &&
    ax + aw > bx &&
    ay < by + bh &&
    ay + ah > by
  );

}


/* =========================================
   MATCH STATE
========================================= */

let timeLeft = 60;

let matchOver = false;

let introTimer = 3.5;

let inIntro = true;

let shakeTime = 0;


/* =========================================
   INPUT HANDLING
========================================= */

function handleInput(
  f,
  other
) {

  if (
    matchOver ||
    inIntro
  ) {
    return;
  }


  f.vx = 0;


  if (
    f.hitStun > 0
  ) {

    f.hitStun--;

    return;

  }


  f.blocking =
    keys[f.ctrl.down] &&
    f.onGround &&
    !f.attackType;


  if (!f.blocking) {

    if (
      keys[f.ctrl.left]
    ) {

      f.vx = -SPEED;

    }


    if (
      keys[f.ctrl.right]
    ) {

      f.vx = SPEED;

    }

  }


  if (
    keys[f.ctrl.up] &&
    f.onGround
  ) {

    f.vy =
      JUMP_V;

    f.onGround =
      false;

  }


  f.facing =
    other.x > f.x
      ? 1
      : -1;


  if (
    f.attackCooldown > 0
  ) {

    f.attackCooldown--;

  }


  if (
    !f.attackType &&
    f.attackCooldown <= 0 &&
    !f.blocking
  ) {

    if (
      keys[f.ctrl.punch]
    ) {

      f.attackType =
        'punch';

      f.attackDuration =
        14;

      f.attackTimer =
        14;

      f.hitThisSwing =
        false;

    }

    else if (
      keys[f.ctrl.kick]
    ) {

      f.attackType =
        'kick';

      f.attackDuration =
        20;

      f.attackTimer =
        20;

      f.hitThisSwing =
        false;

    }

  }

}


/* =========================================
   UPDATE FIGHTER
========================================= */

function updateFighter(f) {

  f.x += f.vx;

  f.y += f.vy;


  if (
    !f.onGround
  ) {

    f.vy -= GRAVITY;

  }


  if (
    f.y <= GROUND_Y
  ) {

    f.y =
      GROUND_Y;

    f.vy =
      0;

    f.onGround =
      true;

  }


  f.x =
    Math.max(
      -ARENA_LIMIT,
      Math.min(
        ARENA_LIMIT,
        f.x
      )
    );


  if (
    f.attackType
  ) {

    f.attackTimer--;


    if (
      f.attackTimer <= 0
    ) {

      f.attackType =
        null;

      f.attackCooldown =
        10;

    }

  }

}


/* =========================================
   HIT DETECTION
========================================= */

function tryHit(
  attacker,
  defender
) {

  if (
    !attacker.attackType ||
    attacker.hitThisSwing
  ) {

    return;

  }


  const activeWindow =
    attacker.attackType === 'punch'
      ? [5, 9]
      : [7, 14];


  const elapsed =
    attacker.attackDuration -
    attacker.attackTimer;


  if (
    elapsed < activeWindow[0] ||
    elapsed > activeWindow[1]
  ) {

    return;

  }


  const reach =
    attacker.attackType === 'punch'
      ? 44
      : 58;


  const attackerW = 30;


  const hitboxX =
    attacker.facing === 1
      ? attacker.x +
        attackerW / 2
      : attacker.x -
        attackerW / 2 -
        reach;


  const hitboxY =
    attacker.y + 40;


  const defenderW = 30;

  const defenderH = 90;


  if (
    rectsOverlapX(
      hitboxX,
      hitboxY,
      reach,
      40,
      defender.x -
        defenderW / 2,
      defender.y,
      defenderW,
      defenderH
    )
  ) {

    attacker.hitThisSwing =
      true;


    const dmg =
      attacker.attackType === 'punch'
        ? 6
        : 10;


    if (
      defender.blocking
    ) {

      defender.hp -=
        dmg * 0.15;


      defender.vx +=
        attacker.facing * 2;


      shakeTime = 4;

    }

    else {

      defender.hp -=
        dmg;


      defender.hitStun =
        10;


      defender.vx =
        attacker.facing * 5;


      spawnBlood(
        defender.x,
        defender.y + 75,
        defender.z,
        attacker.facing
      );


      shakeTime = 10;

    }


    defender.hp =
      Math.max(
        0,
        defender.hp
      );

  }

}


/* =========================================
   VISUAL ANIMATION
========================================= */

function animateFighter(f) {

  const m =
    f.model;


  m.group.position.set(
    f.x,
    f.y,
    f.z
  );


  m.group.rotation.y =
    f.facing === 1
      ? 0
      : Math.PI;


  const t =
    performance.now() *
    0.004;


  const bob =
    f.onGround &&
    f.vx === 0 &&
    !f.attackType

      ? Math.sin(
          t + f.x
        ) * 1.5

      : 0;


  m.torso.position.y =
    78 + bob;


  m.head.position.y =
    112 + bob;


  let armRRot = 0.1;

  let armLRot = -0.1;

  let legRRot = 0;

  let legLRot = 0;


  if (
    f.attackType === 'punch'
  ) {

    const progress =
      1 -
      f.attackTimer /
      f.attackDuration;


    const swing =
      Math.sin(
        progress * Math.PI
      );


    armRRot =
      -swing * 2.0;

  }

  else if (
    f.attackType === 'kick'
  ) {

    const progress =
      1 -
      f.attackTimer /
      f.attackDuration;


    const swing =
      Math.sin(
        progress * Math.PI
      );


    legRRot =
      -swing * 1.3;

  }

  else if (
    f.blocking
  ) {

    armRRot =
      -1.2;

    armLRot =
      1.2;

  }

  else if (
    !f.onGround
  ) {

    legRRot =
      -0.4;

    legLRot =
      0.5;

    armRRot =
      -0.3;

    armLRot =
      0.3;

  }

  else if (
    Math.abs(f.vx) > 0.1
  ) {

    legRRot =
      Math.sin(t * 3) * 0.6;

    legLRot =
      -Math.sin(t * 3) * 0.6;

    armRRot =
      -Math.sin(t * 3) * 0.4;

    armLRot =
      Math.sin(t * 3) * 0.4;

  }


  m.armR.rotation.x +=
    (
      armRRot -
      m.armR.rotation.x
    ) * 0.35;


  m.armL.rotation.x +=
    (
      armLRot -
      m.armL.rotation.x
    ) * 0.35;


  m.legR.rotation.x +=
    (
      legRRot -
      m.legR.rotation.x
    ) * 0.35;


  m.legL.rotation.x +=
    (
      legLRot -
      m.legL.rotation.x
    ) * 0.35;


  const flash =
    f.hitStun > 0
      ? 0.6
      : 0.08;


  m.torso.material.emissiveIntensity +=
    (
      flash -
      m.torso.material.emissiveIntensity
    ) * 0.4;

}


/* =========================================
   HUD
========================================= */

function updateHUD() {

  const hp1El =
    document.getElementById(
      'hp1'
    );


  const hp2El =
    document.getElementById(
      'hp2'
    );


  hp1El.style.width =
    Math.max(
      0,
      p1.hp
    ) + '%';


  hp2El.style.width =
    Math.max(
      0,
      p2.hp
    ) + '%';


  hp1El.classList.toggle(
    'low',
    p1.hp < 30
  );


  hp2El.classList.toggle(
    'low',
    p2.hp < 30
  );


  document.getElementById(
    'timer'
  ).textContent =
    Math.max(
      0,
      Math.ceil(timeLeft)
    );

}


/* =========================================
   BANNER
========================================= */

function showBanner(
  text
) {

  const b =
    document.getElementById(
      'banner'
    );


  b.textContent =
    text;


  b.style.display =
    'block';

}


function hideBanner() {

  document.getElementById(
    'banner'
  ).style.display =
    'none';

}


/* =========================================
   END MATCH
========================================= */

function endMatch(
  text
) {

  matchOver =
    true;


  showBanner(
    text
  );


  document.getElementById(
    'restartBtn'
  ).style.display =
    'inline-block';

}


/* =========================================
   REMATCH
========================================= */

document
  .getElementById(
    'restartBtn'
  )
  .addEventListener(
    'click',
    () => {

      p1.x = -140;
      p1.y = 0;
      p1.vx = 0;
      p1.vy = 0;
      p1.hp = 100;
      p1.attackType = null;
      p1.attackCooldown = 0;
      p1.hitStun = 0;
      p1.blocking = false;


      p2.x = 140;
      p2.y = 0;
      p2.vx = 0;
      p2.vy = 0;
      p2.hp = 100;
      p2.attackType = null;
      p2.attackCooldown = 0;
      p2.hitStun = 0;
      p2.blocking = false;


      particles.forEach(
        p => scene.remove(
          p.mesh
        )
      );


      particles = [];


      decals.forEach(
        d => scene.remove(d)
      );


      decals = [];


      timeLeft = 60;

      matchOver = false;

      inIntro = true;

      introTimer = 3.5;


      document.getElementById(
        'restartBtn'
      ).style.display =
        'none';


      Object.keys(keys)
        .forEach(
          key => {
            keys[key] = false;
          }
        );

    }
  );


/* =========================================
   MAIN GAME LOOP
========================================= */

let lastTick =
  performance.now();


function loop(now) {

  const dt =
    Math.min(
      (now - lastTick) / 1000,
      0.05
    );


  lastTick =
    now;


  /* Torch animation */

  torches.forEach(
    tr => {

      tr.flameLight.intensity =
        tr.baseIntensity +
        Math.random() * 0.5;


      tr.flameMesh.scale.y =
        0.85 +
        Math.random() * 0.3;

    }
  );


  /* Intro */

  if (inIntro) {

    introTimer -= dt;


    if (
      introTimer <= 0
    ) {

      inIntro = false;

      hideBanner();

    }

    else if (
      introTimer > 0.7
    ) {

      showBanner(
        Math.ceil(
          introTimer - 0.7
        )
      );

    }

    else {

      showBanner(
        'FIGHT!'
      );

    }

  }


  /* Game */

  else if (!matchOver) {

    timeLeft -= dt;


    handleInput(
      p1,
      p2
    );


    handleInput(
      p2,
      p1
    );


    updateFighter(
      p1
    );


    updateFighter(
      p2
    );


    tryHit(
      p1,
      p2
    );


    tryHit(
      p2,
      p1
    );


    /* Match result */

    if (
      p1.hp <= 0 ||
      p2.hp <= 0
    ) {

      if (
        p1.hp <= 0 &&
        p2.hp <= 0
      ) {

        endMatch(
          'DOUBLE K.O.'
        );

      }

      else if (
        p1.hp <= 0
      ) {

        endMatch(
          'VOLKAN WINS'
        );

      }

      else {

        endMatch(
          'RONIN WINS'
        );

      }

    }

    else if (
      timeLeft <= 0
    ) {

      if (
        p1.hp > p2.hp
      ) {

        endMatch(
          'RONIN WINS'
        );

      }

      else if (
        p2.hp > p1.hp
      ) {

        endMatch(
          'VOLKAN WINS'
        );

      }

      else {

        endMatch(
          'DRAW'
        );

      }

    }

  }


  /* Particles */

  updateParticles();


  /* Fighters */

  animateFighter(
    p1
  );


  animateFighter(
    p2
  );


  /* =====================================
     CAMERA
  ====================================== */

  const midX =
    (
      p1.x +
      p2.x
    ) / 2;


  const sway =
    Math.sin(
      now * 0.0004
    ) * 6;


  let camX =
    camBase.x +
    midX * 0.18 +
    sway;


  let camY =
    camBase.y;


  let camZ =
    camBase.z;


  if (
    shakeTime > 0
  ) {

    camX +=
      (
        Math.random() - 0.5
      ) * shakeTime;


    camY +=
      (
        Math.random() - 0.5
      ) * shakeTime;


    shakeTime -= 1;

  }


  camera.position.set(
    camX,
    camY,
    camZ
  );


  camera.lookAt(
    midX * 0.3,
    70,
    0
  );


  /* HUD */

  updateHUD();


  /* Render */

  renderer.render(
    scene,
    camera
  );


  requestAnimationFrame(
    loop
  );

}


requestAnimationFrame(
  loop
);

</script>
